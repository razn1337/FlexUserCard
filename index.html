<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/CSS/reset.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./assets/CSS/style.css" />
    <title>User Card</title>
  </head>
  <body>
    <article class="userCard">
      <button class="dotsBtn">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>
      <img
        class="userImg"
        src="https://images.pexels.com/photos/3931310/pexels-photo-3931310.jpeg"
        alt="Sathish Kumar"
      />
      <h2 class="userName">Sathish Kumar</h2>
      <p class="userJob">UI/UX Mobile Designer</p>
      <ul class="stats">
        <li>
          <span class="statsLabel">Projects</span>
          <span class="statsValue">17</span>
        </li>
        <li>
          <span class="statsLabel">Following</span>
          <span class="statsValue">159</span>
        </li>
        <li>
          <span class="statsLabel">Followers</span>
          <span class="statsValue">205</span>
        </li>
      </ul>
      <p class="aboutUser">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Excepturi, est
        veritatis dolore voluptas officiis facilis a eum ipsa enim doloremque
        molestias.
      </p>
      <ul class="socialLinks">
        <li class="twitterLink">
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </li>
        <li class="facebookLink">
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        </li>
        <li class="googleLink">
          <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>
        </li>
        <li class="behanceLink">
          <a href="#"><i class="fa-brands fa-behance"></i></a>
        </li>
      </ul>
      <button class="profileBtn">View Profile</button>
    </article>
  </body>
</html>
